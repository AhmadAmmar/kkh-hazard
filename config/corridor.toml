# Roads of the study network. Each road is its places in order and the OSM road classes it may use; src/01_roads.py
# finds each place in OSM (name:en or name; nearest to the previous place when the name repeats; a [lon, lat] hint is
# used where a name is missing or ambiguous in OSM) and routes through the OpenStreetMap network between them.
# Groups: trunk (national links), access (valleys where a public authority must keep roads, schools, clinics and
# power reachable), passes (seasonal crossings). Buffer for analysis in km.
buffer_km = 10
box = [71.2, 33.4, 77.2, 37.2]       # west, south, east, north (Pakistan side; China G314 as a later extension)

