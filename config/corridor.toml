# Roads of the corridor, each defined by its towns in order (lon, lat) and the OSM road classes it may use. Routes are
# found through the OpenStreetMap network (src/01_roads.py), so a road is exactly the way a driver takes, not every
# way that happens to share a name. Buffer for analysis in km.
buffer_km = 10
box = [72.3, 33.4, 77.0, 37.2]       # west, south, east, north (Pakistan side; China side G314 as a later extension)

